<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .pulse-node {
      animation: pulseNode 3.5s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 15s linear infinite;
    }
    .floating-pill {
      animation: floatPill 6s infinite ease-in-out;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -140; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.6; }
      50% { r: 8; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow Circles -->
  <circle cx="150" cy="180" r="160" fill="url(#glowGrad)" />
  <circle cx="1050" cy="180" r="180" fill="url(#glowGrad)" />

  <!-- Subtle Tech Grid -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Marketing Flow Pathways (Background & Sides) -->
  <g fill="none">
    <path class="flow-line" d="M 50 180 Q 200 80 400 130 T 750 90 T 1150 180" stroke="#38bdf8" stroke-width="2" opacity="0.45" />
    <path class="flow-line" d="M 50 220 Q 250 290 550 240 T 900 270 T 1150 160" stroke="#818cf8" stroke-width="2" opacity="0.4" style="animation-direction: reverse; animation-duration: 18s;" />
  </g>

  <!-- Animated Lead Pulse Nodes along pipelines -->
  <circle class="pulse-node" cx="220" cy="100" r="6" fill="#38bdf8" />
  <circle class="pulse-node" cx="620" cy="105" r="6" fill="#818cf8" style="animation-delay: 1s;" />
  <circle class="pulse-node" cx="950" cy="272" r="6" fill="#c084fc" style="animation-delay: 2s;" />
  <circle class="pulse-node" cx="360" cy="265" r="6" fill="#38bdf8" style="animation-delay: 1.5s;" />

  <!-- Animated Feature Badges / Floating Pills (Left and Right Flanks) -->
  <g class="floating-pill" transform="translate(60, 48)">
    <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="70" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 Lead Scoring</text>
  </g>

  <g class="floating-pill" transform="translate(60, 278)" style="animation-delay: 2s;">
    <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
    <text x="72" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ RevOps Pipelines</text>
  </g>

  <g class="floating-pill" transform="translate(995, 48)" style="animation-delay: 1.2s;">
    <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.9" />
    <text x="72" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 AI Campaigns</text>
  </g>

  <g class="floating-pill" transform="translate(995, 278)" style="animation-delay: 3s;">
    <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.9" />
    <text x="72" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 Open Source</text>
  </g>

  <!-- Central Foreground Titles & Subtitles (Unobscured Foreground) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 78)">
    <rect x="-135" y="-16" width="270" height="32" rx="16" fill="#1e293b" stroke="#4f46e5" stroke-width="1" />
    <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">THE DEFINITIVE REVOPS DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="152" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#glow)">Awesome B2B Marketing Automation</text>

  <!-- Subtitle -->
  <text x="600" y="200" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" text-anchor="middle">Lead Generation • Campaign Orchestration • Revenue Operations • CDP</text>

  <!-- Bottom Details Badge Line -->
  <g transform="translate(600, 246)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="600">Enterprise SaaS Leaders</tspan>
      <tspan fill="#64748b"> &amp; </tspan>
      <tspan fill="#34d399" font-weight="600">Self-Hosted Open-Source Stacks</tspan>
      <tspan fill="#64748b"> • Verified Pricing &amp; Metrics</tspan>
    </text>
  </g>
</svg>
